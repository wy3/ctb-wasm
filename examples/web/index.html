<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="在浏览器中将 EPSG:4326 GeoTIFF 转换为 Cesium quantized-mesh 地形 ZIP"
    />
    <title>GeoTIFF 地形 ZIP 示例</title>
  </head>
  <body>
    <main class="panel">
      <header>
        <nav class="language"><a href="/en.html" lang="en">English</a></nav>
        <p class="eyebrow">CTB-WASM</p>
        <h1>GeoTIFF → Cesium 地形 ZIP</h1>
        <p class="intro">
          在浏览器中读取高程 GeoTIFF，生成 quantized-mesh 瓦片和 <code>layer.json</code>，
          然后下载为 ZIP。
        </p>
      </header>

      <form id="generator">
        <label class="field">
          <span>输入 GeoTIFF</span>
          <input id="geotiff" type="file" accept=".tif,.tiff,image/tiff" required />
        </label>

        <label class="field">
          <span>最高 Zoom</span>
          <input id="max-zoom" type="number" min="0" max="30" value="8" required />
        </label>

        <button id="submit" type="submit">生成并下载 ZIP</button>
        <a id="download" hidden>下载生成的 ZIP</a>
        <progress id="progress" max="100" value="0" hidden></progress>
        <p id="status" role="status" aria-live="polite">选择 GeoTIFF 后开始生成。</p>
      </form>

      <aside>
        <h2>输入要求</h2>
        <ul>
          <li>单波段、EPSG:4326、北向上、未旋转、PixelIsArea。</li>
          <li>高程值应已是米；采样遇到 NoData 时会报错。</li>
          <li>示例会将栅格外的采样点延伸为最近的边缘值。</li>
          <li>高 Zoom 或大文件会占用较多内存，建议先用低 Zoom 验证。</li>
        </ul>
      </aside>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
